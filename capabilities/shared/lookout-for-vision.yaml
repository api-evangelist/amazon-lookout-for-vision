naftiko: "1.0.0-alpha1"

info:
  label: "Amazon Lookout for Vision"
  description: "Amazon Lookout for Vision API for visual anomaly detection and quality inspection using computer vision."
  tags:
    - Amazon
    - Computer Vision
    - Machine Learning
    - Quality Inspection
    - Manufacturing
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
      AWS_REGION: AWS_REGION

capability:
  consumes:
    - type: http
      namespace: lookout-for-vision
      baseUri: https://lookoutvision.{region}.amazonaws.com
      description: "Amazon Lookout for Vision REST API"
      authentication:
        type: apikey
        key: Authorization
        value: "AWS4-HMAC-SHA256 {{AWS_ACCESS_KEY_ID}}"
        placement: header
      resources:
        - name: projects
          path: /2020-11-20/projects
          description: "Manage Lookout for Vision projects"
          operations:
            - name: create-project
              method: POST
              description: "Create a new project"
              inputParameters:
                - name: body
                  in: body
                  type: object
                  required: true
                  description: "Project configuration"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: list-projects
              method: GET
              description: "List all projects"
              inputParameters:
                - name: NextToken
                  in: query
                  type: string
                  required: false
                  description: "Pagination token"
                - name: MaxResults
                  in: query
                  type: integer
                  required: false
                  description: "Maximum results"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: describe-project
              method: GET
              description: "Get project details"
              inputParameters:
                - name: projectName
                  in: path
                  type: string
                  required: true
                  description: "Project name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-project
              method: DELETE
              description: "Delete a project"
              inputParameters:
                - name: projectName
                  in: path
                  type: string
                  required: true
                  description: "Project name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: models
          path: /2020-11-20/projects/{projectName}/models
          description: "Manage computer vision models"
          operations:
            - name: create-model
              method: POST
              description: "Train a new model"
              inputParameters:
                - name: projectName
                  in: path
                  type: string
                  required: true
                  description: "Project name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: list-models
              method: GET
              description: "List models in a project"
              inputParameters:
                - name: projectName
                  in: path
                  type: string
                  required: true
                  description: "Project name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: describe-model
              method: GET
              description: "Get model details"
              inputParameters:
                - name: projectName
                  in: path
                  type: string
                  required: true
                  description: "Project name"
                - name: modelVersion
                  in: path
                  type: string
                  required: true
                  description: "Model version"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: start-model
              method: POST
              description: "Start a model for inference"
              inputParameters:
                - name: projectName
                  in: path
                  type: string
                  required: true
                  description: "Project name"
                - name: modelVersion
                  in: path
                  type: string
                  required: true
                  description: "Model version"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: stop-model
              method: POST
              description: "Stop a running model"
              inputParameters:
                - name: projectName
                  in: path
                  type: string
                  required: true
                  description: "Project name"
                - name: modelVersion
                  in: path
                  type: string
                  required: true
                  description: "Model version"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: detect-anomalies
              method: POST
              description: "Detect anomalies in an image"
              inputParameters:
                - name: projectName
                  in: path
                  type: string
                  required: true
                  description: "Project name"
                - name: modelVersion
                  in: path
                  type: string
                  required: true
                  description: "Model version"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: lookout-for-vision-api
      resources:
        - path: /v1/projects
          name: projects
          description: "Manage projects"
          operations:
            - method: POST
              name: create-project
              description: "Create a project"
              call: "lookout-for-vision.create-project"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: GET
              name: list-projects
              description: "List projects"
              call: "lookout-for-vision.list-projects"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/projects/{id}/models
          name: models
          description: "Manage models"
          operations:
            - method: GET
              name: list-models
              description: "List models"
              call: "lookout-for-vision.list-models"
              with:
                projectName: "rest.id"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: lookout-for-vision-mcp
      transport: http
      tools:
        - name: create-project
          description: "Create a new Lookout for Vision project"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "lookout-for-vision.create-project"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-projects
          description: "List all Lookout for Vision projects"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "lookout-for-vision.list-projects"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-model
          description: "Train a new computer vision model"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "lookout-for-vision.create-model"
          with:
            projectName: "tools.projectName"
          outputParameters:
            - type: object
              mapping: "$."
        - name: start-model
          description: "Start a model for real-time inference"
          hints:
            readOnly: false
            destructive: false
            idempotent: true
          call: "lookout-for-vision.start-model"
          with:
            projectName: "tools.projectName"
            modelVersion: "tools.modelVersion"
          outputParameters:
            - type: object
              mapping: "$."
        - name: detect-anomalies
          description: "Detect visual anomalies in an image using a trained model"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "lookout-for-vision.detect-anomalies"
          with:
            projectName: "tools.projectName"
            modelVersion: "tools.modelVersion"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-models
          description: "List all models in a project"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "lookout-for-vision.list-models"
          with:
            projectName: "tools.projectName"
          outputParameters:
            - type: object
              mapping: "$."
        - name: describe-model
          description: "Get details and status of a specific model"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "lookout-for-vision.describe-model"
          with:
            projectName: "tools.projectName"
            modelVersion: "tools.modelVersion"
          outputParameters:
            - type: object
              mapping: "$."
        - name: stop-model
          description: "Stop a running inference model to reduce costs"
          hints:
            readOnly: false
            destructive: false
            idempotent: true
          call: "lookout-for-vision.stop-model"
          with:
            projectName: "tools.projectName"
            modelVersion: "tools.modelVersion"
          outputParameters:
            - type: object
              mapping: "$."
